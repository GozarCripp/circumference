<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Circumference</title>
<meta name="description" content="Circumference: Naked & Uninsured. You wake up naked on a round planet, owning nothing. A 2.5D turn-based roguelike RPG for phone, tablet, and desktop.">

<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%232d1458'/%3E%3Crect y='5' width='16' height='3' fill='%23b23a6a'/%3E%3Crect y='8' width='16' height='3' fill='%23f5874a'/%3E%3Crect x='5' y='6' width='6' height='5' fill='%23ffd23f'/%3E%3Crect x='4' y='8' width='8' height='3' fill='%23ffd23f'/%3E%3Crect y='11' width='16' height='5' fill='%23120826'/%3E%3Crect y='11' width='16' height='1' fill='%23ff2fa0'/%3E%3Crect y='14' width='16' height='1' fill='%23ff2fa0'/%3E%3C/svg%3E">

<body>
<div id="app">
  <canvas id="world"></canvas>          <!-- render/renderer.js -->
  <div id="hud"></div>                  <!-- ui/hud.js: bars, zone, gold, minimap, buttons -->
  <div id="log"></div>                  <!-- ui/hud.js: message log -->
  <div id="hotbar"></div>               <!-- ui/hud.js: spell gems + action buttons -->
  <div id="banner"></div>               <!-- ui/hud.js: "You have entered …" -->
  <div id="pop" class="panel"></div>    <!-- ui/popup.js: tap-to-inspect / confirm -->
  <div id="panel"></div>                <!-- ui/gear.js + ui/panels.js: modal screens -->
</div>
<div id="title"><canvas id="tc"></canvas><div id="tap">TAP TO WAKE UP</div><div id="tip"></div></div>
<div id="toast"></div>
<noscript><p style="color:#fff;padding:20px;font-family:sans-serif">Circumference needs JavaScript. The planet regrets the inconvenience.</p></noscript>
<script>
  // ES modules do not load from file:// — say so instead of showing a blank page.
  if (location.protocol === 'file:') document.getElementById('toast').style.display = 'block',
    document.getElementById('toast').textContent = 'Open this through a web server (python3 -m http.server) or GitHub Pages; browsers will not load ES modules from file://. The ASCII original in classic/index.html works from anywhere.';
</script>
<script type="module" src="src/main.js"></script>
</body>

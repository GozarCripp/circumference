name: pages
on:
  push:
    branches: [main, foreverquest-uncircumferenced]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: classic
      - uses: actions/checkout@v4
        with:
          ref: foreverquest-uncircumferenced
          path: dev
        continue-on-error: true
      - name: Assemble site
        run: |
          mkdir _site
          cp classic/index.html _site/index.html
          if [ -f dev/index.html ]; then
            mkdir _site/2.5d
            rsync -a --exclude='.git' --exclude='.github' --exclude='README.md' dev/ _site/2.5d/
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

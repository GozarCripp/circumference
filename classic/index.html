*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body{margin:0;background:#08080c;color:#ccc;font-family:Menlo,Consolas,monospace;height:100vh;overflow:hidden;touch-action:none;display:flex;flex-direction:column;align-items:center}
#hud{width:100%;padding:6px 10px;font-size:13px;display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;color:#eee}
#cv{display:block;touch-action:none}
#log{width:100%;max-width:1000px;height:78px;overflow:hidden;font-size:12px;padding:4px 10px;color:#999}
#log div:first-child{color:#fff}
#pop{position:fixed;display:none;min-width:200px;max-width:280px;background:#151520f2;border:1px solid #446;border-radius:12px;padding:12px;font-size:13px;line-height:1.45;box-shadow:0 6px 24px #000a;z-index:5}
#pop hr{border:0;border-top:1px solid #334;margin:6px 0}
#pop .b{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
#pop button{flex:1;padding:10px 8px;font:inherit;background:#2a2a40;color:#fff;border:1px solid #556;border-radius:8px}
#pop button.x{flex:0;background:#1a1a22;color:#888}
#over{position:fixed;inset:0;background:#000d;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:9}
#over button{margin-top:16px;padding:12px 24px;font:inherit;background:#2a2a40;color:#fff;border:1px solid #555;border-radius:10px}
#hud button{font:inherit;font-size:13px;background:#2a2a40;color:#fff;border:1px solid #556;border-radius:6px;padding:2px 12px}
#gear{position:fixed;inset:5% 4%;max-width:560px;margin:auto;display:none;overflow-y:auto;background:#12121cf6;border:1px solid #446;border-radius:14px;padding:12px;font-size:14px;z-index:6}
#gear .gh{display:flex;justify-content:space-between;align-items:center;margin:8px 0 4px;color:#fff}
#gear .gh button{background:#1a1a22;color:#aaa;border:1px solid #444;border-radius:8px;padding:6px 12px;font:inherit}
#gear .r{padding:8px;border-bottom:1px solid #223;line-height:1.4}#gear .l{color:#888;display:inline-block;width:78px}#gear small{color:#999}

#gear .b button{flex:1;padding:8px;font:inherit;background:#2a2a40;color:#fff;border:1px solid #556;border-radius:8px}#gear .b button.x{flex:0 0 70px;background:#1a1a22;color:#888}
#title{position:fixed;inset:0;z-index:20;background:#120826;cursor:pointer}
#tc{width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#tap{position:absolute;bottom:9%;width:100%;text-align:center;color:#fff;font-family:'Titan One',sans-serif;font-size:20px;letter-spacing:2px;text-shadow:0 0 0 #000,2px 2px #ff7a1a;animation:bl 1.2s steps(2) infinite}
#tip{position:absolute;bottom:4%;width:100%;text-align:center;color:#8fd3ff;font-size:13px;padding:0 20px}
@keyframes bl{50%{opacity:0}}
@media (min-width:700px){#hud{font-size:16px}#log{font-size:15px;height:100px}#pop{font-size:15px;max-width:320px}}

function h2(x,y,s){let n=Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(s+SEED,982451653)|0;n=Math.imul(n^(n>>>13),1274126177);return ((n^(n>>>16))>>>0)/4294967296;}
function vn(x,y,sc,s){const per=Math.max(1,Math.round(WS/sc)),S=WS/per,fx=wx(x)/S,fy=wx(y)/S,ix=Math.floor(fx),iy=Math.floor(fy),tx=fx-ix,ty=fy-iy,u=tx*tx*(3-2*tx),v=ty*ty*(3-2*ty),i2=(ix+1)%per,j2=(iy+1)%per;
 const a=h2(ix,iy,s),b=h2(i2,iy,s),c=h2(ix,j2,s),d=h2(i2,j2,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
const fbm=(x,y,sc,s)=>vn(x,y,sc,s)*.6+vn(x,y,sc/2,s+7)*.3+vn(x,y,sc/4,s+13)*.1;

function biome(x,y){if(DG)return 4;x=wx(x);y=wx(y);const d=tdist(x,y);if(d<20)return 0;
 if(fbm(x,y,96,1)+Math.max(0,d-180)/1400>.71)return 3;if(fbm(x,y,110,40)>.6)return 4;const b=fbm(x,y,70,2);return b<.46?0:b<.56?1:2;}
function terr(x,y){if(DG){const r=DG.floors[DG.i].map[y];return T[(r&&r[x])||'void'];}x=wx(x);y=wx(y);const k=x+','+y;let t=tc.get(k);if(t)return t;t=T[mods.get(k)||tname(x,y)];if(tc.size>300000)tc.clear();tc.set(k,t);return t;}
function tname(x,y){const b=biome(x,y),r=fbm(x,y,6,3),r2=h2(x,y,4),o=fbm(x,y,128,30);
 if(tdist(x,y)>25){if(o<.315)return'deep';if(o<.335)return'water';}
 if(b==0){const rv=Math.abs(fbm(x,y,45,9)-.5);if(rv<.007)return'deep';if(rv<.022)return'water';return r>.63||r2<.035?'tree':r<.38?'bush':'grass';}
 if(b==1){const bf=fbm(x,y,10,6);return bf>.66?'deep':bf>.57?'bogw':r2<.03?'dtree':r<.4?'reed':'mud';}
 if(b==2){const S=12,cx=Math.floor(x/S),cy=Math.floor(y/S),lx=mod(x,S),ly=mod(y,S);
  if(h2(cx,cy,20)<.6){if((lx==0||ly==0)&&lx!=6&&ly!=6)return h2(x,y,21)<.12?'rubble':'wall';
   if(lx%4==2&&ly%4==2&&h2(cx,cy,22)<.5)return'pillar';return'stone';}
  return r2<.15?'rubble':'stone';}
 if(b==4){const S=48,cx=Math.floor(x/S),cy=Math.floor(y/S),px=cx*S+24,py=cy*S+24;
  if(h2(cx,cy,50)<.5&&biome(px,py)==4&&biome(px,py+8)==4){const r=4+Math.floor(h2(cx,cy,52)*3),dx=Math.abs(x-px),dy=y-py;
   if(dx<=r&&Math.abs(dy)<=r)return dx==0&&dy==r?'pdoor':'pyr';if(dx<=r+1&&dy==r+1)return'sand';}
  if(fbm(x,y,9,8)>.68)return'srock';return r2<.02?'cactus':r>.62?'dune':'sand';}
 const f=fbm(x,y,9,8);return f>.6||r2<.02?'rock':f<.4?'ice':r<.45?'scree':'snow';}

  for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const nx=x+a,ny=y+b,k=key(nx,ny);
   if(prev.has(k)||Math.abs(nx-P.x)>40||Math.abs(ny-P.y)>40||blocks(nx,ny)||(!wet&&deep(nx,ny)&&!(nx==tx&&ny==ty)))continue;
   const m=monAt(nx,ny);if(m&&shown(m)&&!thru)continue;prev.set(k,key(x,y));q.push([nx,ny]);}}
